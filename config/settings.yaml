# Paramètres métier et quantitatifs. Les valeurs sont des points de départ :
# à revoir par le BA, puis à recaler sur les données réelles le jour 1.

tiers:
  # Palier simple : l'émetteur a au moins N obligations de même devise et
  # même séniorité, et la maturité cible est dans leur plage.
  min_issuer_bonds_simple: 3
  # Séniorités traitées d'office comme complexes.
  complex_seniorities: [TIER2, AT1, SUBORDINATED, HYBRID]

comparables:
  top_k: 15
  min_candidates: 5          # en dessous, on relâche un filtre dur
  bandwidth: 0.25            # largeur du noyau sur la distance
  issuer_shrinkage_k: 2.0    # lambda = n / (n + k)
  weights:                   # distance de Gower pondérée (somme = 1)
    notch: 0.35
    maturity: 0.25
    sector: 0.25
    country: 0.10
    size: 0.05

peer_curve:
  ridge: 0.01

ml:
  iterations: 300
  depth: 5
  learning_rate: 0.08

calibration:
  alpha: 0.10                # intervalle à 90 %
  n_folds: 5
  min_per_key: 50            # effectif minimal pour un quantile par palier
  seed: 7

confidence:
  weights:
    interval: 0.40
    comparables: 0.30
    agreement: 0.20
    domain: 0.10
  interval_ref: 0.60         # demi-largeur en log donnant un score nul
  agreement_ref: 0.30        # écart champion-challenger en log donnant zéro
  domain_ref: 30             # effectif de segment donnant un score plein
  grades: {A: 75, B: 50}

controls:
  max_model_gap: 0.25        # écart champion-challenger en log
  min_effective_comparables: 3.0

feedback:
  weights: {trade: 1.0, opinion: 0.3}
