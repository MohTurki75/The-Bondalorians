# Paramètres métier et quantitatifs. Les valeurs sont des points de départ :
# à revoir par le BA, puis à recaler sur les données réelles le jour 1.

tiers:
  # Palier simple : l'émetteur a au moins N obligations de même devise et
  # même séniorité, et la maturité cible est dans leur plage.
  min_issuer_bonds_simple: 3
  # Séniorités traitées d'office comme complexes.
  complex_seniorities: [TIER2, AT1, SUBORDINATED, HYBRID]

comparables:
  min_candidates: 5          # en dessous, on relâche un filtre dur
  # lambda = n / (n + k). "auto" : k estimé par analyse de variance des résidus
  # (variance du bruit / variance entre émetteurs). Un nombre force la valeur.
  issuer_shrinkage_k: auto
  # Réglage automatique des trois paramètres ci-dessous sur le backtest.
  # Les valeurs écrites ici servent de point de départ et de repli.
  tune: true
  tune_trials: 200
  tune_share: 0.10           # part des obligations servant au réglage (autant pour valider)
  tune_min_weight: 0.05      # poids minimal de chaque critère (garde-fou métier)
  # Pente de maturité propre à chaque émetteur, rétrécie selon l'étendue de ses
  # maturités (estimation par les moments, comme k).
  issuer_slope: true
  top_k: 15
  bandwidth: 0.25            # largeur du noyau sur la distance
  weights:                   # distance de Gower pondérée (somme = 1)
    notch: 0.35
    maturity: 0.25
    sector: 0.25
    country: 0.10
    size: 0.05

peer_curve:
  ridge: 0.01
  # Termes explicables ajoutés : courbure de maturité, sensibilité à la notation
  # par secteur, prime de séniorité selon la notation, pays, taille de la souche.
  enriched: true
  # Variables supplémentaires du jour 1, à n'activer que si scripts/jour1.py montre
  # qu'elles réduisent l'erreur : esg, age (ancienneté de l'émission), duration.
  # Jamais price ni ytm : ils sont liés mécaniquement au spread.
  extra: []

ml:
  iterations: 300            # modèle B : CatBoost indépendant
  depth: 5
  learning_rate: 0.08
  # Contrainte de monotonie (notation, séniorité) : mesurée, elle crée un biais de −4 %
  # et 7 % d'erreur en plus ; désactivée. La monotonie est vérifiée à part.
  monotone: false
  corrector: true            # modèle C : CatBoost qui corrige le modèle A
  corrector_iterations: 200
  corrector_depth: 4

calibration:
  alpha: 0.10                # intervalle à 90 %
  n_folds: 5
  min_per_key: 50            # effectif minimal pour un quantile par palier
  seed: 7
  adaptive: true             # intervalle élargi ou resserré selon la difficulté prédite
  peer_curve_candidate: true  # la courbe des pairs seule peut être retenue (même marge)
  champion_margin: 0.05      # gain relatif exigé pour qu'un modèle ML détrône le modèle A

confidence:
  # Le score est appris (part des cas du backtest jugés plus difficiles).
  # Seuls les seuils des notes restent fixés.
  grades: {A: 75, B: 50}
  # Le modèle de difficulté reçoit le désaccord des comparables et la dispersion
  # des obligations de l'émetteur autour de sa courbe.
  dispersion_features: true

controls:
  max_model_gap: 0.25        # écart champion-challenger en log
  min_effective_comparables: 3.0

feedback:
  weights: {trade: 1.0, opinion: 0.3}

analysis:
  # Nombre de familles affiché quand les données n'ont pas de structure en
  # groupes nette (cas d'un continuum). Choix de lecture, pas un résultat.
  clustering_reading_k: 4

top_down:
  # Lecture de contrôle affichée avec chaque estimation (jamais le chiffre retenu) :
  # « Entonnoir avec maturité », « Entonnoir » (maturité seulement corrigée),
  # « Descendante lissée », « Descendante stricte » ou « Descendante mixte ».
  reader: Entonnoir avec maturité
  max_gap: 0.25              # écart relatif au-delà duquel le contrôle passe en alerte

funnel:
  # Taille minimale du panier : une variable n'est imposée que s'il reste au
  # moins ce nombre d'obligations. Mesuré : l'erreur baisse jusqu'à environ 150.
  min_basket: 150

subordination:
  # Candidat S : dette subordonnée = dette senior de l'émetteur (ramenée au profil de
  # la cible) + prime de subordination mesurée chez les émetteurs qui ont les deux.
  # Retenu seulement si le backtest le juge meilleur (même marge que les autres).
  enabled: true
  shrink: true               # niveau senior de l'émetteur rétréci comme l'écart émetteur (n / (n + k))
